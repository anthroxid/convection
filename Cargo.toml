[package]
name = "convection"
version = "0.1.0"
authors = ["Nicolas Frey <nicolas.theo.frey@gmail.com>", "Angelo Wang <angelo.fu.wang@gmail.com"]
edition = "2024"
readme = "README.md"

[[bin]]
name = "convection-gui"
path = "src/convection-gui.rs"

[[bin]]
name = "copernicus-test"
path = "src/copernicus-test.rs"

[workspace]
members = [
  "render",
  "copernicus-core",
  "tiling",
  "convection-types"
]

[workspace.dependencies]
render = { path = "./render" }
copernicus-core = { path = "./copernicus-core" }
tiling = { path = "./tiling" }
convection-types = { path = "./convection-types" }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "serde",
    "wgsl",
    "vulkan",
    "gles",
    "dx12",
    "metal",
    "vulkan-portability",
    "angle",
    "static-dxc",
] }
ndarray = "0.17"
anyhow = "1"
serde = "1"
serde_json = "1"
eccodes = "0.14"
reqwest = "0.13"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
glam = "0.33"
typed-builder = "0.23"

[dependencies]
render.workspace = true
copernicus-core.workspace = true
anyhow.workspace = true
