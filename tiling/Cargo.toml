[package]
name = "tiling"
version = "0.1.0"
edition = "2024"

[dependencies]
image.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"], optional = true }
copernicus-core = { workspace = true, optional = true }
convection-types.workspace = true
typed-builder.workspace = true
glam.workspace = true
log.workspace = true

[dev-dependencies]
env_logger = "0.11"

[features]
default-features = ["osm", "copernicus"]
osm = ["dep:reqwest"]
copernicus = ["dep:copernicus-core"]
